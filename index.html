<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Central London Offices Guide</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/din-pro" />
    <style>
      :root{
        --brand:#CC2030;
        --ink:#0F172A;
        --muted-ink:#475569;
        --surface:#FFFFFF;
        --ui:#F5F6F8;
        --stroke:#E5E7EB;
        --water:#8EC5E8;
        --water-stroke:#6CAED6;
        --radius-1:6px;
        --radius-2:8px;
        --shadow-1:0 4px 12px rgba(0,0,0,.12);
        --popup-accent: var(--brand);
        --header-h: 0px;
      }

      html, body {
        min-height:100%;
        overflow-y:auto;
        overflow-x:hidden;
      }
      body {
        margin:0;
        display:block;
        background:var(--surface);
        color:var(--ink);
        font-family:"DIN Pro","DINPro",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      }
      .site-header{
        position:fixed;
        top:0; left:0; right:0;
        z-index:10;
        background:var(--surface);
        border-bottom:1px solid var(--stroke);
        box-shadow:0 1px 2px rgba(0,0,0,.04);
        padding:12px 16px 8px;
        margin:0;
        text-align:center;
      }
      h1{
        margin:0;
        letter-spacing:1px;
        font-weight:700;
        text-transform:uppercase;
        color:var(--brand);
      }
      .subtitle{
        margin:4px 0 0;
        color:var(--muted-ink);
      }
      #map{
        position:relative;
        margin-top:var(--header-h);
        height:clamp(320px,58vh,640px);
        min-height:320px;
        background:var(--ui);
        padding-bottom:env(safe-area-inset-bottom);
        box-sizing:border-box;
      }
      .map-footer-actions{
        display:flex;
        justify-content:center;
        padding:16px 12px 0;
      }
      .table-toggle{
        display:inline-flex;
        align-items:center;
        gap:8px;
        background:var(--brand);
        color:var(--surface);
        border:none;
        border-radius:999px;
        padding:10px 18px;
        font-size:.95rem;
        font-weight:700;
        letter-spacing:.4px;
        text-transform:uppercase;
        cursor:pointer;
        box-shadow:0 6px 16px rgba(204,32,48,0.2);
        transition:background .18s ease, box-shadow .18s ease, transform .18s ease;
      }
      .table-toggle:focus-visible{
        outline:3px solid rgba(204,32,48,0.3);
        outline-offset:2px;
      }
      .table-toggle:hover{box-shadow:0 8px 18px rgba(204,32,48,0.26); transform:translateY(-1px);}
      .table-toggle:active{transform:translateY(0); box-shadow:0 4px 12px rgba(204,32,48,0.22);}
      .table-toggle.is-open{background:var(--ink); box-shadow:0 6px 16px rgba(15,23,42,0.18);}
      .table-toggle .toggle-label{line-height:1;}
      .table-toggle .chevron{
        width:12px;
        height:12px;
        border-right:2px solid currentColor;
        border-bottom:2px solid currentColor;
        transform:rotate(45deg);
        transition:transform .18s ease;
        margin-top:-2px;
      }
      .table-toggle.is-open .chevron{transform:rotate(-135deg);}
      .psf-control{
        position:absolute;
        bottom:8px;
        right:8px;
        background:rgba(255,255,255,.8);
        border:1px solid var(--stroke);
        border-radius:var(--radius-1);
        padding:4px 8px;
        font-size:.7rem;
        color:var(--muted-ink);
      }

      .custom-popup{pointer-events:none; opacity:0; transform:translateY(2px); transition:opacity .16s ease, transform .16s ease;}
      .custom-popup.active{opacity:1; transform:translateY(0);}
      .custom-popup *{pointer-events:none;user-select:none;}
      .custom-popup .maplibregl-popup-content{
        background:rgba(255,255,255,.85);
        border:1px solid var(--stroke);
        border-radius:10px;
        box-shadow:var(--shadow-1);
        padding:8px 10px 10px;
        margin:0;
        text-align:center;
        box-sizing:border-box;
        white-space:normal;
        overflow-wrap:anywhere;
        word-break:break-word;
        max-width:min(90vw, 260px);
        font-family:"DIN Pro","DINPro",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
        font-variant-numeric:tabular-nums;
        position:relative;
      }
      .custom-popup .maplibregl-popup-content::before{
        content:"";
        position:absolute;
        top:0; left:0; right:0;
        height:3px;
        background:var(--popup-accent);
        border-top-left-radius:10px;
        border-top-right-radius:10px;
      }
      .custom-popup .maplibregl-popup-tip{display:none;}
      .pop-inner{opacity:1; transform:translateY(0); transition:opacity .14s ease, transform .14s ease;}
      .pop-inner.is-out{opacity:0; transform:translateY(4px);}
      .pop-inner.is-in{opacity:1; transform:translateY(0);}
      .popup-title-row{display:flex; align-items:center; justify-content:center; gap:8px; margin:2px 0 4px;}
      .popup-title{color:var(--ink); font-weight:700; font-size:1rem; letter-spacing:.3px; line-height:1.2; margin:0; padding:0 2px; text-transform:uppercase;}
      .popup-prices{margin-top:6px; display:flex; justify-content:center; gap:8px; flex-wrap:wrap;}
      .price-box{border:1px solid var(--stroke); background:#FAFAFB; border-radius:8px; padding:4px 6px; min-width:72px; line-height:1.2;}
      .price-box .grade{display:block; color:var(--muted-ink); font-size:.85rem; font-weight:700; letter-spacing:.2px;}
      .price-box .price{display:block; color:var(--ink); font-size:1rem; font-weight:600;}

      .table-wrap{
        margin:28px auto 64px;
        padding:0 12px 32px;
        max-width:min(1100px,95vw);
      }
      .table-wrap[hidden]{display:none;}
      .table-wrap h2{
        margin:0 0 16px;
        font-weight:800;
        letter-spacing:1px;
        text-transform:uppercase;
        font-size:1rem;
        color:var(--ink);
        position:relative;
        display:inline-block;
        padding-top:6px;
      }
      .table-wrap h2::after{
        content:"";
        position:absolute;
        top:0;
        left:0;
        width:100%;
        height:3px;
        background:var(--brand);
        border-radius:4px;
      }
      .table-scroller{
        overflow:auto;
        background:var(--surface);
        border:1px solid var(--stroke);
        border-radius:var(--radius-2);
        box-shadow:0 4px 10px rgba(0,0,0,.08);
      }
      .rent-table{
        width:100%;
        border-collapse:separate;
        border-spacing:0;
        font-variant-numeric:tabular-nums;
      }
      .rent-table caption{
        caption-side:bottom;
        text-align:right;
        padding:10px 12px;
        color:var(--muted-ink);
        font-size:.85rem;
      }
      .rent-table thead th{
        position:sticky;
        top:0;
        z-index:1;
        background:var(--ui);
        color:var(--muted-ink);
        text-align:left;
        font-weight:800;
        padding:12px 14px;
        border-bottom:1px solid var(--stroke);
      }
      .rent-table tbody td{
        padding:12px 14px;
        border-bottom:1px solid #F1F2F4;
      }
      .rent-table tbody tr:nth-child(even){
        background:#FAFAFB;
      }
      .rent-table tbody tr:hover{
        background:rgba(204,32,48,0.06);
      }
      .rent-table a{
        font-weight:700;
        color:var(--ink);
        text-decoration:none;
        transition:text-shadow .18s ease, text-decoration-color .18s ease;
      }
      .rent-table a:hover{
        text-decoration:underline;
        text-decoration-color:var(--brand);
        text-shadow:0 1px 0 rgba(204,32,48,0.18);
      }
      .rent-table .no-link{
        color:var(--muted-ink);
        font-weight:600;
        opacity:.9;
        cursor:default;
      }

      @media (max-width:480px){
        .site-header{padding:10px 12px 0;}
        h1{font-size:1.6rem;}
        #map{height:clamp(280px,52vh,520px);}
        .map-footer-actions{padding:12px 12px 0;}
        .table-toggle{padding:9px 16px; font-size:.9rem;}
        .custom-popup .maplibregl-popup-content{max-width:calc(100vw - 24px); padding:6px 8px 8px;}
        .popup-title{font-size:.92rem;}
        .price-box{min-width:65px; padding:4px 6px;}
        .rent-table thead th,
        .rent-table tbody td{padding:10px 12px; font-size:.95rem;}
        .rent-table caption{text-align:left; padding:10px 10px;}
      }
      @media (prefers-reduced-motion: reduce){
        *{transition:none!important;}
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <h1>CENTRAL LONDON OFFICES GUIDE</h1>
      <p class="subtitle">Click a subdistrict to get started</p>
    </header>

    <div id="map">
      <div class="psf-control">*All prices are per sq ft</div>
    </div>

    <div class="map-footer-actions">
      <button type="button" id="toggle-table" class="table-toggle" aria-expanded="false" aria-controls="rents-section">
        <span class="toggle-label">View rent table</span>
        <span class="chevron" aria-hidden="true"></span>
      </button>
    </div>

    <section id="rents-section" class="table-wrap" aria-labelledby="rents-heading" hidden>
      <h2 id="rents-heading">Central London Office Rents</h2>
      <div class="table-scroller">
        <table id="rents-table" class="rent-table" aria-describedby="rents-caption">
          <caption id="rents-caption">*All prices are per sq ft</caption>
          <thead>
            <tr>
              <th scope="col">Submarket</th>
              <th scope="col">Grade A</th>
              <th scope="col">Grade B</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <script>
      var priceData = {
        Camden: { A: "£63.00", B: "£42.50" },
        "Euston & Kings Cross": { A: "£89.00", B: "£60.00" },
        "Mayfair & St James's": { A: "£170.00", B: "£87.00" },
        Soho: { A: "£100.00", B: "£69.50" },
        "Covent Garden": { A: "£90.00", B: "£62.00" },
        "Victoria / Westminster": { A: "£95.00", B: "£60.00" },
        "City (EC2, EC3, EC4)": { A: "£85.00", B: "£52.00" },
        "Clerkenwell & Farringdon": { A: "£90.00", B: "£65.00" },
        "Old Street / Shoreditch": { A: "£80.00", B: "£52.00" },
        "Aldgate / Whitechapel": { A: "£60.00", B: "£40.00" },
        "Vauxhall / Nine Elms & Battersea": { A: "£63.00", B: "£40.00" },
        Southbank: { A: "£85.00", B: "£52.00" },
        Midtown: { A: "£85.00", B: "£55.00" },
        "Canary Wharf": { A: "£55.00", B: "£32.00" },
        "Noho / Fitzrovia": { A: "£105.00", B: "£65.00" },
        Marylebone: { A: "£98.00", B: "£62.50" },
        Paddington: { A: "£85.00", B: "£50.00" },
        "Kensington & Chelsea": { A: "£75.00", B: "£42.50" },
        "White City / Shepherd's Bush": { A: "£58.00", B: "£40.00" },
        Hammersmith: { A: "£58.00", B: "£40.00" },
        "Knightsbridge / Belgravia": { A: "£90.00", B: "£60.00" }
      };

      const labelToUrl = {
        "Noho / Fitzrovia": "https://infogram.com/noho-fitzrovia-1hmr6g8ye03yz2n"
      };

      const root = document.documentElement;
      const headerEl = document.querySelector('.site-header');

      const map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
          sources: {},
          layers: [{ id: 'background', type: 'background', paint: { 'background-color': '#ffffff' } }]
        },
        center: [-0.1278, 51.5074],
        zoom: 11,
        canvasContextAttributes: { antialias: true },
        antialias: true
      });

      map.dragPan.disable();
      map.scrollZoom.disable();
      map.doubleClickZoom.disable();
      map.boxZoom.disable();
      map.keyboard.disable();
      map.dragRotate.disable();
      map.touchZoomRotate.disable();
      map.getCanvas().style.cursor = 'default';

      const mapContainer = document.getElementById('map');
      if (mapContainer && window.ResizeObserver) {
        const mapObserver = new ResizeObserver(() => map.resize());
        mapObserver.observe(mapContainer);
      }
      window.addEventListener('resize', () => map.resize());
      window.addEventListener('orientationchange', () => {
        map.resize();
        updateHeaderHeight();
      });

      async function updateHeaderHeight(){
        if (!headerEl) return;
        if (document.fonts && document.fonts.ready) {
          try { await document.fonts.ready; } catch(e){}
        }
        const h = Math.ceil(headerEl.getBoundingClientRect().height);
        root.style.setProperty('--header-h', h + 'px');
        map.resize();
      }
      updateHeaderHeight();
      if (headerEl && window.ResizeObserver) {
        const headerRO = new ResizeObserver(() => updateHeaderHeight());
        headerRO.observe(headerEl);
      } else if (headerEl) {
        window.addEventListener('resize', updateHeaderHeight);
      }
      map.once('load', () => map.resize());

      let hoveredId = null;
      const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, className: 'custom-popup', maxWidth: '260px' });
      popup.on('open', () => popup.getElement().style.pointerEvents = 'none');
      let popupTimer = null;
      let hoverLeaveTimer = null;
      let popupFadeTimer = null;

      const brand = getComputedStyle(document.documentElement).getPropertyValue('--brand').trim();
      const water = getComputedStyle(document.documentElement).getPropertyValue('--water').trim();
      const waterStroke = getComputedStyle(document.documentElement).getPropertyValue('--water-stroke').trim();

      function setHover(id, isHovering) {
        map.setFeatureState({ source: 'subdistricts', id }, { hover: isHovering });
      }

      function getFeatureBoundsCenter(coords) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        const flat = coords.flat(Infinity);
        for (let i = 0; i < flat.length; i += 2) {
          const x = flat[i], y = flat[i + 1];
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
        return [(minX + maxX) / 2, (minY + maxY) / 2];
      }

      function renderPopup(label, dataInfo){
        const title = (label || '').toUpperCase();
        const prices = dataInfo ? `
    <div class="popup-prices">
      <div class="price-box"><span class="grade">Grade A</span><span class="price">${dataInfo.A}</span></div>
      <div class="price-box"><span class="grade">Grade B</span><span class="price">${dataInfo.B}</span></div>
    </div>` : '';
        return `
    <div class="pop-inner" data-label="${title}" role="status" aria-live="polite">
      <div class="popup-title-row">
        <h3 class="popup-title">${title}</h3>
      </div>
      ${prices}
    </div>`;
      }

      function removeHover() {
        if (hoveredId) {
          setHover(hoveredId, false);
          hoveredId = null;
          hidePopup();
          map.getCanvas().style.cursor = 'default';
        }
        clearTimeout(popupTimer);
      }

      function showPopup(center, label) {
        const nextHtml = renderPopup(label, priceData[label]);
        const isOpen = popup.isOpen();
        clearTimeout(popupFadeTimer);

        if (!isOpen) {
          popup.setLngLat(center).setHTML(nextHtml).addTo(map);
          requestAnimationFrame(() => popup.getElement().classList.add('active'));
          return;
        }

        const el = popup.getElement();
        if (el) el.classList.add('active');

        const current = popup.getElement().querySelector('.pop-inner');
        const currentLabel = current ? current.getAttribute('data-label') : '';
        const nextLabel = (label || '').toUpperCase();

        if (currentLabel === nextLabel) {
          popup.setLngLat(center);
          return;
        }

        if (current) current.classList.add('is-out');
        setTimeout(() => {
          popup.setLngLat(center).setHTML(nextHtml);
          const fresh = popup.getElement().querySelector('.pop-inner');
          fresh.classList.add('is-out');
          requestAnimationFrame(() => {
            fresh.classList.remove('is-out');
            fresh.classList.add('is-in');
          });
        }, 130);
      }

      function hidePopup(){
        if (!popup.isOpen()) return;
        const el = popup.getElement();
        el.classList.remove('active');
        clearTimeout(popupFadeTimer);
        popupFadeTimer = setTimeout(() => popup.remove(), 180);
      }

      function scheduleClearHover() {
        clearTimeout(hoverLeaveTimer);
        hoverLeaveTimer = setTimeout(removeHover, 100);
      }

      function buildRentsTable(){
        const tbody = document.querySelector('#rents-table tbody');
        const labels = Object.keys(priceData).filter(label => label !== 'River Thames').sort((a, b) => a.localeCompare(b));
        const frag = document.createDocumentFragment();

        for (const label of labels){
          const tr = document.createElement('tr');

          const tdLabel = document.createElement('td');
          const url = labelToUrl[label];
          if (url){
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener';
            a.textContent = label;
            a.title = `Open ${label} dashboard`;
            tdLabel.appendChild(a);
          } else {
            const span = document.createElement('span');
            span.textContent = label;
            span.className = 'no-link';
            tdLabel.appendChild(span);
          }

          const tdA = document.createElement('td');
          tdA.textContent = priceData[label]?.A || '—';

          const tdB = document.createElement('td');
          tdB.textContent = priceData[label]?.B || '—';

          tr.appendChild(tdLabel);
          tr.appendChild(tdA);
          tr.appendChild(tdB);
          frag.appendChild(tr);
        }

        tbody.innerHTML = '';
        tbody.appendChild(frag);
      }

      const tableSection = document.getElementById('rents-section');
      const tableToggleButton = document.getElementById('toggle-table');
      const tableToggleLabel = tableToggleButton ? tableToggleButton.querySelector('.toggle-label') : null;

      function setTableVisibility(shouldShow) {
        if (!tableSection || !tableToggleButton || !tableToggleLabel) return;
        tableSection.hidden = !shouldShow;
        tableToggleButton.setAttribute('aria-expanded', shouldShow ? 'true' : 'false');
        tableToggleButton.classList.toggle('is-open', shouldShow);
        tableToggleLabel.textContent = shouldShow ? 'Hide rent table' : 'View rent table';
      }

      if (tableToggleButton) {
        setTableVisibility(false);
        tableToggleButton.addEventListener('click', () => {
          const nextState = tableSection ? tableSection.hidden : true;
          setTableVisibility(nextState);
          if (nextState && tableSection && tableSection.scrollIntoView) {
            requestAnimationFrame(() => tableSection.scrollIntoView({ behavior: 'smooth', block: 'start' }));
          }
        });
      }

      map.on('load', function () {
        var cacheBuster = '?v=' + Date.now();
        var localUrl = 'final_poly.geojson' + cacheBuster;
        var remoteUrl = 'https://raw.githubusercontent.com/CharlieCoughlin1/Central_London_Submarkets/main/final_poly.geojson' + cacheBuster;

        fetch(localUrl)
          .then(function (response) {
            if (!response.ok) { throw new Error('Network response was not ok'); }
            return response.json();
          })
          .catch(function () {
            return fetch(remoteUrl).then(function (response) {
              if (!response.ok) { throw new Error('Network response was not ok'); }
              return response.json();
            });
          })
          .then(function (data) {
            map.addSource('subdistricts', {
              type: 'geojson',
              data: data,
              maxzoom: 22,
              promoteId: 'label'
            });

            map.addLayer({
              id: 'thames-fill',
              type: 'fill',
              source: 'subdistricts',
              filter: ['==', ['get', 'label'], 'River Thames'],
              paint: {
                'fill-color': water,
                'fill-outline-color': 'rgba(0,0,0,0)',
                'fill-opacity': 1
              }
            });

            map.addLayer({
              id: 'thames-outline',
              type: 'line',
              source: 'subdistricts',
              filter: ['==', ['get', 'label'], 'River Thames'],
              paint: {
                'line-color': waterStroke,
                'line-width': 1.2
              },
              layout: {
                'line-join': 'round',
                'line-cap': 'round'
              }
            });

            map.addLayer({
              id: 'subdistrict-fills',
              type: 'fill',
              source: 'subdistricts',
              filter: ['!=', ['get', 'label'], 'River Thames'],
              paint: {
                'fill-color': [
                  'case',
                  ['boolean', ['feature-state', 'hover'], false], 'rgba(204,32,48,0.10)',
                  '#EDEFF2'
                ],
                'fill-outline-color': '#B6BCC6',
                'fill-opacity': 1
              }
            });

            map.addLayer({
              id: 'subdistrict-hover-halo',
              type: 'line',
              source: 'subdistricts',
              filter: ['!=', ['get', 'label'], 'River Thames'],
              paint: {
                'line-color': '#000',
                'line-opacity': ['case', ['boolean', ['feature-state', 'hover'], false], 0.06, 0],
                'line-width': ['case', ['boolean', ['feature-state', 'hover'], false], 4, 0],
                'line-blur': 0.8
              },
              layout: { 'line-join': 'round', 'line-cap': 'round' }
            });

            // Always-on submarket labels (hidden on hover via feature-state)
            map.addLayer({
              id: 'subdistrict-labels',
              type: 'symbol',
              source: 'subdistricts',
              filter: ['!=', ['get', 'label'], 'River Thames'],
              layout: {
                'symbol-placement': 'point',
                'text-field': ['get', 'label'],
                'text-font': ['Open Sans Semibold', 'Open Sans Regular'],
                'text-size': ['interpolate', ['linear'], ['zoom'], 10, 10, 12, 12, 14, 14],
                'text-letter-spacing': 0.05,
                'text-padding': 2,
                'text-allow-overlap': false,
                'text-optional': true
              },
              paint: {
                'text-color': 'rgba(15, 23, 42, 0.86)',
                'text-halo-color': 'rgba(255,255,255,0.95)',
                'text-halo-width': 1.2,
                'text-halo-blur': 0.5,
                'text-opacity': [
                  'case',
                  ['boolean', ['feature-state', 'hover'], false],
                  0,
                  0.88
                ]
              }
            });

            map.addLayer({
              id: 'subdistrict-hover-outline',
              type: 'line',
              source: 'subdistricts',
              filter: ['!=', ['get', 'label'], 'River Thames'],
              paint: {
                'line-color': brand,
                'line-width': ['case', ['boolean', ['feature-state', 'hover'], false], 2, 0],
                'line-opacity': 1,
                'line-blur': 0
              },
              layout: { 'line-join': 'round', 'line-cap': 'round' }
            });

            var bounds = new maplibregl.LngLatBounds();
            data.features.forEach(function (feature) {
              if (feature.properties.label === 'River Thames') return;
              var coords = feature.geometry.coordinates.flat(Infinity);
              for (var i = 0; i < coords.length; i += 2) {
                bounds.extend([coords[i], coords[i + 1]]);
              }
            });
            map.fitBounds(bounds, { padding: { top: 10, right: 20, bottom: 20, left: 20 } });

            function handleMove(e) {
              const features = map.queryRenderedFeatures(e.point, { layers: ['subdistrict-fills'] });
              const feature = features[0];
              if (!feature) {
                map.getCanvas().style.cursor = 'default';
                scheduleClearHover();
                return;
              }

              clearTimeout(hoverLeaveTimer);
              map.getCanvas().style.cursor = 'pointer';
              const id = feature.id || feature.properties.label;
              if (hoveredId !== id) {
                if (hoveredId) setHover(hoveredId, false);
                hoveredId = id;
                setHover(hoveredId, true);
              }

              const center = getFeatureBoundsCenter(feature.geometry.coordinates);
              const label = feature.properties.label;
              showPopup(center, label);
            }

            let pendingMove = false;
            let lastMoveEvent = null;
            map.on('mousemove', function (e) {
              lastMoveEvent = e;
              if (!pendingMove) {
                pendingMove = true;
                requestAnimationFrame(function () {
                  pendingMove = false;
                  handleMove(lastMoveEvent);
                });
              }
            });

            map.on('mouseleave', 'subdistrict-fills', scheduleClearHover);

            map.on('click', function (e) {
              const features = map.queryRenderedFeatures(e.point, { layers: ['subdistrict-fills'] });
              const feature = features[0];
              if (!feature) return;

              const label = feature.properties.label;
              if (labelToUrl[label]) {
                window.open(labelToUrl[label], '_blank');
                return;
              }
              const id = feature.id || label;
              if (hoveredId !== id) {
                if (hoveredId) setHover(hoveredId, false);
                hoveredId = id;
                setHover(hoveredId, true);
              }

              const center = getFeatureBoundsCenter(feature.geometry.coordinates);
              clearTimeout(hoverLeaveTimer);
              showPopup(center, label);
              clearTimeout(popupTimer);
              popupTimer = setTimeout(removeHover, 2500);
            });
          })
          .catch(function (error) {
            console.error('Error loading GeoJSON:', error);
          });
      });

      if (document.readyState !== 'loading') {
        buildRentsTable();
      } else {
        document.addEventListener('DOMContentLoaded', buildRentsTable);
      }
    </script>
  </body>
</html>
