<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Central London Offices Guide</title>
    <link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css" />
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/din-pro" />
    <style>
      :root{
        --brand:#CC2030;
        --ink:#0F172A;
        --muted-ink:#475569;
        --surface:#FFFFFF;
        --ui:#F5F6F8;
        --stroke:#E5E7EB;
        --water:#8EC5E8;
        --water-stroke:#6CAED6;
        --radius-1:6px;
        --radius-2:8px;
        --shadow-1:0 4px 12px rgba(0,0,0,.12);
        --popup-accent: var(--brand);
        --header-h: 0px;
        --table-w: clamp(300px, 32vw, 420px);
        --table-offset: 0px;
        --table-gap: 12px;
      }

      html, body { height:100%; }
      body {
        margin:0;
        display:block;
        background:var(--surface);
        color:var(--ink);
        font-family:"DIN Pro","DINPro",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
        overflow:hidden;
      }
      .site-header{
        position:fixed;
        top:0; left:0; right:0;
        z-index:10;
        background:var(--surface);
        border-bottom:1px solid var(--stroke);
        box-shadow:0 1px 2px rgba(0,0,0,.04);
        padding:12px 16px 8px;
        margin:0;
        text-align:center;
      }
      h1{
        margin:0;
        letter-spacing:1px;
        font-weight:700;
        text-transform:uppercase;
        color:var(--brand);
      }
      .subtitle{
        margin:4px 0 0;
        color:var(--muted-ink);
      }
      #map{
        position:fixed;
        top:var(--header-h);
        left:var(--table-offset);
        right:0;
        bottom:0;
        min-height:320px;
        background:var(--ui);
        padding-bottom:env(safe-area-inset-bottom);
        box-sizing:border-box;
      }

      .polygon-label{
        pointer-events:none;
        display:inline-block;
        padding:4px 8px;
        border:1px solid var(--stroke);
        border-radius:8px;
        background:rgba(255,255,255,0.88);
        box-shadow:0 6px 16px rgba(15,23,42,0.12);
        color:var(--ink);
        font-family:"DIN Pro","DINPro",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
        font-weight:800;
        font-size:0.85rem;
        letter-spacing:.3px;
        text-transform:uppercase;
        text-align:center;
        max-width:180px;
        line-height:1.2;
        white-space:normal;
        word-break:break-word;
      }

      /* PSF note */
      .psf-control{
        position:absolute;
        bottom:8px;
        right:8px;
        background:rgba(255,255,255,.8);
        border:1px solid var(--stroke);
        border-radius:var(--radius-1);
        padding:4px 8px;
        font-size:.7rem;
        color:var(--muted-ink);
        z-index:3;
      }

      /* Hide table + labels in non-desktop views */
      body:not(.is-desktop) .panel-controls,
      body:not(.is-desktop) .psf-control,
      body:not(.is-desktop) .polygon-label{
        display:none !important;
      }

      /* Right-side rents table button + panel */
      .panel-controls{
        position:fixed;
        top:calc(var(--header-h) + 12px);
        left:12px;
        display:flex;
        flex-direction:column;
        align-items:flex-start;
        gap:8px;
        z-index:6;
        width:var(--table-w);
        max-width:95vw;
      }
      .table-toggle{
        appearance:none;
        border:1px solid var(--stroke);
        background:rgba(255,255,255,.92);
        border-radius:var(--radius-1);
        box-shadow:var(--shadow-1);
        color:var(--ink);
        font-weight:700;
        letter-spacing:.3px;
        padding:8px 12px;
        font-size:.85rem;
        display:inline-flex;
        align-items:center;
        gap:8px;
        width:auto;
        min-width:0;
        align-self:flex-start;
        cursor:pointer;
        transition:background .12s ease, transform .06s ease;
        text-align:left;
      }
      .table-toggle:hover{ background:#fff; }
      .table-toggle:active{ transform:translateY(1px); }
      .table-toggle .toggle-icon{
        color:var(--muted-ink);
        font-size:.9rem;
        line-height:1;
      }
      .table-toggle .toggle-label{ white-space:nowrap; }

      .table-panel{
        position:relative;
        width:100%;
        max-height:calc(100vh - var(--header-h) - 40px);
        background:var(--surface);
        border:1px solid var(--stroke);
        border-radius:10px;
        box-shadow:var(--shadow-1);
        overflow:hidden;
      }
      .table-panel[aria-hidden="true"]{ display:none; }
      .table-panel .panel-accent{
        height:3px;
        background:var(--brand);
      }
      .panel-header{
        display:flex; align-items:center; justify-content:space-between;
        padding:10px 12px 8px;
      }
      .panel-title{
        margin:0;
        font-weight:800;
        letter-spacing:.8px;
        text-transform:uppercase;
        font-size:.95rem;
        color:var(--ink);
      }
      .panel-close{
        appearance:none;
        border:1px solid var(--stroke);
        background:#fff;
        border-radius:8px;
        font-size:1rem;
        line-height:1;
        padding:4px 8px;
        cursor:pointer;
        color:var(--muted-ink);
        transition:background .12s ease;
      }
      .panel-close:hover{ background:#FAFAFB; }

      .table-scroller{
        overflow:auto;
        max-height:calc(62vh - 54px);
        border-top:1px solid var(--stroke);
        background:var(--surface);
      }

      .rent-table{
        width:100%;
        border-collapse:separate;
        border-spacing:0;
        font-variant-numeric:tabular-nums;
      }
      body.table-open{ --table-offset: calc(var(--table-w) + var(--table-gap)); }
      body.table-collapsed{ --table-offset: 0px; }

      .sort-button{
        appearance:none;
        background:none;
        border:none;
        padding:0;
        color:inherit;
        font:inherit;
        font-weight:800;
        display:inline-flex;
        align-items:center;
        gap:6px;
        cursor:pointer;
      }
      .sort-button .sort-indicator{
        font-size:.8rem;
        color:var(--muted-ink);
        opacity:.6;
        transition:opacity .12s ease;
      }
      .sort-button:hover .sort-indicator{ opacity:1; }
      .rent-table caption{
        caption-side:bottom;
        text-align:right;
        padding:10px 12px;
        color:var(--muted-ink);
        font-size:.85rem;
      }
      .rent-table thead th{
        position:sticky;
        top:0;
        z-index:1;
        background:var(--ui);
        color:var(--muted-ink);
        text-align:left;
        font-weight:800;
        padding:12px 14px;
        border-bottom:1px solid var(--stroke);
      }
      .rent-table tbody td{
        padding:12px 14px;
        border-bottom:1px solid #F1F2F4;
      }
      .rent-table tbody tr:nth-child(even){ background:#FAFAFB; }
      .rent-table tbody tr:hover{ background:rgba(204,32,48,0.06); }
      .rent-table a{
        font-weight:700;
        color:var(--ink);
        text-decoration:none;
      }
      .rent-table a:hover{ text-decoration:underline; text-decoration-color:var(--brand); }
      .rent-table .no-link{
        color:var(--muted-ink);
        font-weight:700;
        cursor:default;
      }

      /* --- Client logo banner (outside #map, fixed to viewport) --- */
      .logo-marquee{
        position:fixed;
        left:12px;
        right:12px;
        bottom:calc(env(safe-area-inset-bottom) + 12px);
        z-index:2; /* Below PSF note (z:3) & table UI (z:6); above the map */
        background:#3F4040;
        border:1px solid #3F4040;
        border-radius:12px;
        box-shadow:var(--shadow-1);
        pointer-events:none; /* never block map interactions */
        backdrop-filter:saturate(120%) blur(4px);
      }
      .logo-marquee .logo-accent{
        display:none;
      }
      .logo-banner-inner{
        padding:8px 6px 6px;
      }
      .banner-subtitle{
        margin:0 6px 2px;
        text-align:center;
        color:#fff;
        font-weight:900;
        letter-spacing:.6px;
        text-transform:uppercase;
        font-size:.9rem;
      }
      .logo-viewport{
        position:relative;
        overflow:hidden;
        padding:4px 4px 6px;
      }
      .logo-viewport::before,
      .logo-viewport::after{
        content:"";
        position:absolute;
        top:0; bottom:0;
        width:40px;
        pointer-events:none;
        z-index:1;
      }
      .logo-viewport::before{
        left:0;
        background:linear-gradient(to right, rgba(63,64,64,0.96), rgba(63,64,64,0));
      }
      .logo-viewport::after{
        right:0;
        background:linear-gradient(to left, rgba(63,64,64,0.96), rgba(63,64,64,0));
      }
      .logo-track{
        display:flex;
        align-items:center;
        width:max-content; /* content defines natural width */
        will-change:transform;
        animation: marquee-ltr 55s linear infinite; /* left-to-right */
      }
      /* Left-to-right continuous loop: render two identical strips (A + B). */
      @keyframes marquee-ltr{
        0%   { transform: translateX(-50%); }
        100% { transform: translateX(0%); }
      }
      .logo-strip{
        display:flex;
        align-items:center;
        gap:12px; /* reduced gap */
        list-style:none;
        margin:0;
        padding:0 8px 2px;
        flex:0 0 auto;
      }
      .logo-strip li{
        display:flex;
        align-items:center;
        justify-content:center;
        flex:0 0 auto;
      }
      .logo-strip img{
        display:block;
        height:64px;       /* larger logos */
        max-width:220px;
        object-fit:contain;
        opacity:.98;
        filter:none;
        clip-path:inset(1px round 3px);
      }

      @media (max-width:480px){
        .site-header{padding:10px 12px 0;}
        h1{font-size:1.6rem;}
        .custom-popup .maplibregl-popup-content{max-width:calc(100vw - 24px); padding:6px 8px 8px;}
        .popup-title{font-size:.92rem;}
        .price-box{min-width:65px; padding:4px 6px;}
        .rent-table thead th, .rent-table tbody td{ padding:10px 12px; }
        .table-panel{ width:calc(100vw - 24px); right:0; }
        .banner-subtitle{ font-size:.72rem; }
        .logo-banner-inner{ padding:7px 6px 6px; }
        .logo-viewport{ padding:3px 4px 5px; }
        .logo-strip{ gap:10px; padding:0 6px 2px; }
        .logo-strip img{ height:44px; max-width:190px; clip-path:inset(.8px round 2px); }
      }
      @media (max-width:960px){
        body.table-open{ --table-offset: 0px; }
        .panel-controls{ width:calc(100vw - 24px); left:12px; }
        .table-toggle{ text-align:center; }
      }
      @media (max-width:720px){
        :root{ --table-gap: 10px; }
        #map{ top:calc(var(--header-h) + 4px); }
        .panel-controls{ left:10px; right:10px; width:auto; gap:10px; }
        .table-toggle{ text-align:center; border-radius:12px; }
        .table-panel{ width:100%; border-radius:14px; box-shadow:0 10px 24px rgba(15,23,42,0.18); }
        .table-scroller{ max-height:calc(58vh - 54px); }
        .logo-marquee{ left:10px; right:10px; }
      }
      @media (prefers-reduced-motion: reduce){
        *{transition:none!important;}
        .logo-track{ animation:none!important; }
      }

      /* Popup (unchanged) */
      .custom-popup{pointer-events:none; opacity:0; transform:translateY(2px); transition:opacity .16s ease, transform .16s ease;}
      .custom-popup.active{opacity:1; transform:translateY(0);}
      .custom-popup *{pointer-events:none;user-select:none;}
      .custom-popup .maplibregl-popup-content{
        background:rgba(255,255,255,.85);
        border:1px solid var(--stroke);
        border-radius:10px;
        box-shadow:var(--shadow-1);
        padding:8px 10px 10px;
        margin:0;
        text-align:center;
        box-sizing:border-box;
        white-space:normal;
        overflow-wrap:anywhere;
        word-break:break-word;
        max-width:min(90vw, 260px);
        font-family:"DIN Pro","DINPro",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
        font-variant-numeric:tabular-nums;
        position:relative;
      }
      .custom-popup .maplibregl-popup-content::before{
        content:"";
        position:absolute;
        top:0; left:0; right:0;
        height:3px;
        background:var(--popup-accent);
        border-top-left-radius:10px;
        border-top-right-radius:10px;
      }
      .custom-popup .maplibregl-popup-tip{display:none;}
      .pop-inner{opacity:1; transform:translateY(0); transition:opacity .14s ease, transform .14s ease;}
      .pop-inner.is-out{opacity:0; transform:translateY(4px);}
      .pop-inner.is-in{opacity:1; transform:translateY(0);}
      .popup-title-row{
        display:flex; align-items:center; justify-content:center; gap:8px;
        margin:2px 0 4px;
      }
      .popup-title{
        color:var(--ink);
        font-weight:700; font-size:1rem; letter-spacing:.3px;
        line-height:1.2; margin:0; padding:0 2px;
        text-transform:uppercase;
      }
      .popup-prices{
        margin-top:6px;
        display:flex; justify-content:center; gap:8px; flex-wrap:wrap;
      }
      .price-box{
        border:1px solid var(--stroke);
        background:#FAFAFB;
        border-radius:8px;
        padding:4px 6px;
        min-width:72px;
        line-height:1.2;
      }
      .price-box .grade{
        display:block; color:var(--muted-ink); font-size:.85rem; font-weight:700; letter-spacing:.2px;
      }
      .price-box .price{
        display:block; color:var(--ink); font-size:1rem; font-weight:600;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <h1>CENTRAL LONDON OFFICES GUIDE</h1>
      <p class="subtitle">Click a subdistrict to get started</p>
    </header>

    <div id="map">
      <!-- Right-side toggle and drop-down panel for the table -->
      <div class="panel-controls">
        <button class="table-toggle" type="button" aria-expanded="true" aria-controls="rents-panel" title="Collapse rents table">
          <span class="toggle-icon" aria-hidden="true">▾</span>
          <span class="toggle-label">Collapse Rents Table</span>
        </button>

        <aside id="rents-panel" class="table-panel" role="dialog" aria-labelledby="rents-panel-title" aria-hidden="false">
          <div class="panel-accent" aria-hidden="true"></div>
          <div class="panel-header">
            <h2 id="rents-panel-title" class="panel-title">Central London Office Rents</h2>
            <button class="panel-close" type="button" aria-label="Close rents table">&times;</button>
          </div>
          <div class="table-scroller">
            <table id="rents-table" class="rent-table" aria-describedby="rents-caption">
              <caption id="rents-caption">*All prices are per sq ft</caption>
              <thead>
                <tr>
                  <th scope="col"><button class="sort-button" type="button" data-sort="submarket" aria-sort="ascending">Submarket <span class="sort-indicator">⇅</span></button></th>
                  <th scope="col"><button class="sort-button" type="button" data-sort="priceA" aria-sort="none">Grade A <span class="sort-indicator">⇅</span></button></th>
                  <th scope="col"><button class="sort-button" type="button" data-sort="priceB" aria-sort="none">Grade B <span class="sort-indicator">⇅</span></button></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </aside>
      </div>

      <div class="psf-control">*All prices are per sq ft</div>
    </div>

    <!-- Client logos banner (outside #map so MapLibre cannot hide it) -->
    <div class="logo-marquee" id="logo-marquee" role="region" aria-label="Clients we work with">
      <div class="logo-accent" aria-hidden="true"></div>
      <div class="logo-banner-inner">
        <p class="banner-subtitle">TRUSTED BY LEADING OFFICE OCCUPIERS</p>
        <div class="logo-viewport">
          <div class="logo-track" id="logo-track">
            <!-- JS injects two identical strips for a seamless left-to-right scroll -->
          </div>
        </div>
      </div>
    </div>

    <script src="vendor/maplibre-gl/maplibre-gl.js"></script>
    <script>
      /* === DATA === */
      var priceData = {
        Camden: { A: "£63.00", B: "£42.50" },
        "Euston & Kings Cross": { A: "£89.00", B: "£60.00" },
        "Mayfair & St James's": { A: "£170.00", B: "£87.00" },
        Soho: { A: "£100.00", B: "£69.50" },
        "Covent Garden": { A: "£90.00", B: "£62.00" },
        "Victoria / Westminster": { A: "£95.00", B: "£60.00" },
        "City (EC2, EC3, EC4)": { A: "£85.00", B: "£52.00" },
        "Clerkenwell & Farringdon": { A: "£90.00", B: "£65.00" },
        "Old Street / Shoreditch": { A: "£80.00", B: "£52.00" },
        "Aldgate / Whitechapel": { A: "£60.00", B: "£40.00" },
        "Vauxhall / Nine Elms & Battersea": { A: "£63.00", B: "£40.00" },
        Southbank: { A: "£85.00", B: "£52.00" },
        Midtown: { A: "£85.00", B: "£55.00" },
        "Canary Wharf": { A: "£55.00", B: "£32.00" },
        "Noho / Fitzrovia": { A: "£105.00", B: "£65.00" },
        Marylebone: { A: "£98.00", B: "£62.50" },
        Paddington: { A: "£85.00", B: "£50.00" },
        "Kensington & Chelsea": { A: "£75.00", B: "£42.50" },
        "White City / Shepherd's Bush": { A: "£58.00", B: "£40.00" },
        Hammersmith: { A: "£58.00", B: "£40.00" },
        "Knightsbridge / Belgravia": { A: "£90.00", B: "£60.00" }
      };

      const labelToUrl = {
        "Noho / Fitzrovia": "https://infogram.com/noho-fitzrovia-1hmr6g8ye03yz2n"
      };

      /* === MAP (restored to proven working state — no persistent labels) === */
      const root = document.documentElement;
      const headerEl = document.querySelector('.site-header');
      const logoMarqueeEl = document.getElementById('logo-marquee');

      const map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
          sources: {},
          layers: [{ id: 'background', type: 'background', paint: { 'background-color': '#ffffff' } }]
        },
        center: [-0.1278, 51.5074],
        zoom: 11,
        canvasContextAttributes: { antialias: true },
        antialias: true
      });

      // Disable interactions (as before)
      map.dragPan.disable();
      map.scrollZoom.disable();
      map.doubleClickZoom.disable();
      map.boxZoom.disable();
      map.keyboard.disable();
      map.dragRotate.disable();
      map.touchZoomRotate.disable();
      map.getCanvas().style.cursor = 'default';

      const mapContainer = document.getElementById('map');
      const desktopMedia = window.matchMedia('(min-width: 1200px)');

      let hoveredId = null;
      let activeHoverLabel = null;
      const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, className: 'custom-popup', maxWidth: '260px' });
      popup.on('open', () => popup.getElement().style.pointerEvents = 'none');
      let popupTimer = null;
      let hoverLeaveTimer = null;
      let popupFadeTimer = null;

      const brand = getComputedStyle(document.documentElement).getPropertyValue('--brand').trim();
      const water = getComputedStyle(document.documentElement).getPropertyValue('--water').trim();
      const waterStroke = getComputedStyle(document.documentElement).getPropertyValue('--water-stroke').trim();
      const labelMarkers = [];
      let geojsonFeatures = null;
      let closePanelForDesktop = null;
      let openPanelForDesktop = null;
      let panelUserCollapsed = false;
      let panelCollapsedByMedia = false;

      function isDesktopView(){
        return desktopMedia.matches;
      }

      function setHover(id, isHovering) {
        map.setFeatureState({ source: 'subdistricts', id }, { hover: isHovering });
      }

      function getFeatureBoundsCenter(coords) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        const flat = coords.flat(Infinity);
        for (let i = 0; i < flat.length; i += 2) {
          const x = flat[i], y = flat[i + 1];
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
        return [(minX + maxX) / 2, (minY + maxY) / 2];
      }

      function setLabelVisibility(label, isVisible){
        if (!label) return;
        const entry = labelMarkers.find(item => item.label === label);
        const el = entry?.marker?.getElement?.();
        if (el) {
          el.style.opacity = isVisible ? '1' : '0';
        }
      }

      function renderPopup(label, dataInfo){
        const title = (label || '').toUpperCase();
        const prices = dataInfo ? `
    <div class="popup-prices">
      <div class="price-box"><span class="grade">Grade A</span><span class="price">${dataInfo.A}</span></div>
      <div class="price-box"><span class="grade">Grade B</span><span class="price">${dataInfo.B}</span></div>
    </div>` : '';
        return `
    <div class="pop-inner" data-label="${title}" role="status" aria-live="polite">
      <div class="popup-title-row">
        <h3 class="popup-title">${title}</h3>
      </div>
      ${prices}
    </div>`;
      }

      function removeHover() {
        if (hoveredId) {
          setHover(hoveredId, false);
          hoveredId = null;
          hidePopup();
          map.getCanvas().style.cursor = 'default';
        }
        clearTimeout(popupTimer);
        if (activeHoverLabel) {
          setLabelVisibility(activeHoverLabel, true);
          activeHoverLabel = null;
        }
      }

      function showPopup(center, label) {
        const nextHtml = renderPopup(label, priceData[label]);
        const isOpen = popup.isOpen();
        clearTimeout(popupFadeTimer);

        if (!isOpen) {
          popup.setLngLat(center).setHTML(nextHtml).addTo(map);
          requestAnimationFrame(() => popup.getElement().classList.add('active'));
          return;
        }

        const el = popup.getElement();
        if (el) el.classList.add('active');

        const current = popup.getElement().querySelector('.pop-inner');
        const currentLabel = current ? current.getAttribute('data-label') : '';
        const nextLabel = (label || '').toUpperCase();

        if (currentLabel === nextLabel) {
          popup.setLngLat(center);
          return;
        }

        if (current) current.classList.add('is-out');
        setTimeout(() => {
          popup.setLngLat(center).setHTML(nextHtml);
          const fresh = popup.getElement().querySelector('.pop-inner');
          fresh.classList.add('is-out');
          requestAnimationFrame(() => {
            fresh.classList.remove('is-out');
            fresh.classList.add('is-in');
          });
        }, 130);
      }

      function hidePopup(){
        if (!popup.isOpen()) return;
        const el = popup.getElement();
        el.classList.remove('active');
        clearTimeout(popupFadeTimer);
        popupFadeTimer = setTimeout(() => popup.remove(), 180);
      }

      function scheduleClearHover() {
        clearTimeout(hoverLeaveTimer);
        hoverLeaveTimer = setTimeout(removeHover, 100);
      }

      /* Dynamic padding that respects header + logo banner height.
         Ensures the fitted bounds are never hidden behind chrome. */
      function getDynamicFitPadding(){
        const headerH = Math.ceil(headerEl.getBoundingClientRect().height || 0);
        const bannerH = Math.ceil(logoMarqueeEl?.offsetHeight || 0);
        const safeBottom = 10;
        return {
          top: headerH + 10,
          right: 20,
          bottom: bannerH + safeBottom + 10,
          left: 20
        };
      }

      let initialBounds = null;
      function fitToInitialBounds(options = {}){
        if (!initialBounds) return;
        const padding = getDynamicFitPadding();
        map.fitBounds(initialBounds, {
          padding,
          duration: options.duration ?? 0,
          easing: t => t
        });
      }
      const debouncedRefit = debounce(() => fitToInitialBounds({ duration: 0 }), 120);

      function clearLabels(){
        while(labelMarkers.length){
          const entry = labelMarkers.pop();
          if (entry?.marker) entry.marker.remove();
        }
      }

      function addLabels(features){
        clearLabels();
        if (!isDesktopView() || !Array.isArray(features)) return;
        features
          .filter(f => f?.properties?.label && f.properties.label !== 'River Thames')
          .forEach(feature => {
            const coords = getFeatureBoundsCenter(feature.geometry.coordinates);
            const el = document.createElement('div');
            el.className = 'polygon-label';
            el.textContent = feature.properties.label;
            if (activeHoverLabel === feature.properties.label) {
              el.style.opacity = '0';
            }
            const marker = new maplibregl.Marker({ element: el, anchor: 'center' })
              .setLngLat(coords)
              .addTo(map);
            labelMarkers.push({ label: feature.properties.label, marker });
          });
      }

      function syncDesktopMode(){
        const desktop = isDesktopView();
        document.body.classList.toggle('is-desktop', desktop);
        if (!desktop){
          clearLabels();
          if (closePanelForDesktop) closePanelForDesktop({ reason: 'media' });
        } else {
          if (openPanelForDesktop) openPanelForDesktop();
          if (geojsonFeatures) addLabels(geojsonFeatures);
        }
      }

      // Keep map sized & fitted when UI changes
      new ResizeObserver(() => { map.resize(); debouncedRefit(); syncDesktopMode(); }).observe(mapContainer);
      window.addEventListener('resize', () => { map.resize(); debouncedRefit(); syncDesktopMode(); });
      window.addEventListener('orientationchange', () => { map.resize(); debouncedRefit(); syncDesktopMode(); });
      if (desktopMedia.addEventListener) {
        desktopMedia.addEventListener('change', syncDesktopMode);
      } else if (desktopMedia.addListener) {
        desktopMedia.addListener(syncDesktopMode);
      }

      async function updateHeaderHeight(){
        if (document.fonts && document.fonts.ready) {
          try { await document.fonts.ready; } catch(e){}
        }
        const h = Math.ceil(headerEl.getBoundingClientRect().height);
        root.style.setProperty('--header-h', h + 'px');
        map.resize();
        debouncedRefit();
        syncDesktopMode();
      }
      updateHeaderHeight();
      const headerRO = new ResizeObserver(() => updateHeaderHeight());
      headerRO.observe(headerEl);
      map.once('load', () => map.resize());

      map.on('load', function () {
        var cacheBuster = '?v=' + Date.now();
        var localUrl = 'final_poly.geojson' + cacheBuster;
        var remoteUrl = 'https://raw.githubusercontent.com/CharlieCoughlin1/Central_London_Submarkets/main/final_poly.geojson' + cacheBuster;

        fetch(localUrl)
          .then(function (response) {
            if (!response.ok) { throw new Error('Network response was not ok'); }
            return response.json();
          })
          .catch(function () {
            return fetch(remoteUrl).then(function (response) {
              if (!response.ok) { throw new Error('Network response was not ok'); }
              return response.json();
            });
          })
          .then(function (data) {
            map.addSource('subdistricts', {
              type: 'geojson',
              data: data,
              maxzoom: 22,
              promoteId: 'label'
            });

            // Thames
            map.addLayer({
              id: 'thames-fill',
              type: 'fill',
              source: 'subdistricts',
              filter: ['==', ['get', 'label'], 'River Thames'],
              paint: {
                'fill-color': water,
                'fill-outline-color': 'rgba(0,0,0,0)',
                'fill-opacity': 1
              }
            });

            map.addLayer({
              id: 'thames-outline',
              type: 'line',
              source: 'subdistricts',
              filter: ['==', ['get', 'label'], 'River Thames'],
              paint: {
                'line-color': waterStroke,
                'line-width': 1.2,
                'line-join': 'round',
                'line-cap': 'round',
                'line-smooth': 0.6
              }
            });

            // Fills
            map.addLayer({
              id: 'subdistrict-fills',
              type: 'fill',
              source: 'subdistricts',
              filter: ['!=', ['get', 'label'], 'River Thames'],
              paint: {
                'fill-color': [
                  'case',
                  ['boolean', ['feature-state', 'hover'], false], 'rgba(204,32,48,0.10)',
                  '#EDEFF2'
                ],
                'fill-outline-color': '#B6BCC6',
                'fill-opacity': 1
              }
            });

            // Hover halo + outline
            map.addLayer({
              id: 'subdistrict-hover-halo',
              type: 'line',
              source: 'subdistricts',
              filter: ['!=', ['get', 'label'], 'River Thames'],
              paint: {
                'line-color': '#000',
                'line-opacity': ['case', ['boolean', ['feature-state', 'hover'], false], 0.06, 0],
                'line-width': ['case', ['boolean', ['feature-state', 'hover'], false], 4, 0],
                'line-blur': 0.8
              },
              layout: { 'line-join': 'round', 'line-cap': 'round' }
            });

            map.addLayer({
              id: 'subdistrict-hover-outline',
              type: 'line',
              source: 'subdistricts',
              filter: ['!=', ['get', 'label'], 'River Thames'],
              paint: {
                'line-color': brand,
                'line-width': ['case', ['boolean', ['feature-state', 'hover'], false], 2, 0],
                'line-opacity': 1,
                'line-blur': 0
              },
              layout: { 'line-join': 'round', 'line-cap': 'round' }
            });

            // Compute initial bounds (excluding Thames)
            var bounds = new maplibregl.LngLatBounds();
            data.features.forEach(function (feature) {
              if (feature.properties.label === 'River Thames') return;
              var coords = feature.geometry.coordinates.flat(Infinity);
              for (var i = 0; i < coords.length; i += 2) {
                bounds.extend([coords[i], coords[i + 1]]);
              }
            });
            initialBounds = bounds;
            fitToInitialBounds({ duration: 0 });
            geojsonFeatures = data.features;
            syncDesktopMode();

            // Interaction (hover shows popup; no persistent labels)
            function handleMove(e) {
              const features = map.queryRenderedFeatures(e.point, { layers: ['subdistrict-fills'] });
              const feature = features[0];
              if (!feature) {
                map.getCanvas().style.cursor = 'default';
                scheduleClearHover();
                return;
              }

              clearTimeout(hoverLeaveTimer);
              map.getCanvas().style.cursor = 'pointer';
              const id = feature.id || feature.properties.label;
              if (hoveredId !== id) {
                if (hoveredId) setHover(hoveredId, false);
                hoveredId = id;
                setHover(hoveredId, true);
              }

              const center = getFeatureBoundsCenter(feature.geometry.coordinates);
              const label = feature.properties.label;
              if (label && label !== activeHoverLabel) {
                if (activeHoverLabel) setLabelVisibility(activeHoverLabel, true);
                setLabelVisibility(label, false);
                activeHoverLabel = label;
              }
              showPopup(center, label);
            }

            let pendingMove = false;
            let lastMoveEvent = null;
            map.on('mousemove', function (e) {
              lastMoveEvent = e;
              if (!pendingMove) {
                pendingMove = true;
                requestAnimationFrame(function () {
                  pendingMove = false;
                  handleMove(lastMoveEvent);
                });
              }
            });

            map.on('click', function (e) {
              const features = map.queryRenderedFeatures(e.point, { layers: ['subdistrict-fills'] });
              const feature = features[0];
              if (!feature) return;

              const label = feature.properties.label;
              if (labelToUrl[label]) {
                window.open(labelToUrl[label], '_blank');
                return;
              }
              const id = feature.id || label;
              if (hoveredId !== id) {
                if (hoveredId) setHover(hoveredId, false);
                hoveredId = id;
                setHover(hoveredId, true);
              }

              const center = getFeatureBoundsCenter(feature.geometry.coordinates);
              if (label && label !== activeHoverLabel) {
                if (activeHoverLabel) setLabelVisibility(activeHoverLabel, true);
                setLabelVisibility(label, false);
                activeHoverLabel = label;
              }
              clearTimeout(hoverLeaveTimer);
              showPopup(center, label);
              clearTimeout(popupTimer);
              popupTimer = setTimeout(removeHover, 2500);
            });
          })
          .catch(function (error) {
            console.error('Error loading GeoJSON:', error);
          });
      });

      /* === Rents Table: populate + panel behavior === */
      const tableState = { sortKey: 'submarket', direction: 'asc' };

      function priceToNumber(value){
        if (typeof value !== 'string') return null;
        const cleaned = parseFloat(value.replace(/[^0-9.]/g, ''));
        return Number.isFinite(cleaned) ? cleaned : null;
      }

      function getTableRows(){
        return Object.keys(priceData)
          .filter(label => label !== 'River Thames')
          .map(label => ({
            submarket: label,
            priceAText: priceData[label]?.A || '—',
            priceBText: priceData[label]?.B || '—',
            priceA: priceToNumber(priceData[label]?.A),
            priceB: priceToNumber(priceData[label]?.B),
            url: labelToUrl[label] || ''
          }));
      }

      function applySort(rows){
        const dir = tableState.direction === 'desc' ? -1 : 1;
        const key = tableState.sortKey;
        const fallback = dir === -1 ? -Infinity : Infinity;

        return rows.sort((a, b) => {
          let cmp = 0;
          if (key === 'submarket') {
            cmp = a.submarket.localeCompare(b.submarket);
          } else {
            const aVal = typeof a[key] === 'number' ? a[key] : fallback;
            const bVal = typeof b[key] === 'number' ? b[key] : fallback;
            cmp = aVal === bVal ? 0 : (aVal < bVal ? -1 : 1);
          }
          return cmp * dir;
        });
      }

      function updateSortIndicators(){
        document.querySelectorAll('.sort-button').forEach(btn => {
          const key = btn.getAttribute('data-sort');
          const th = btn.closest('th');
          const indicator = btn.querySelector('.sort-indicator');
          const isActive = key === tableState.sortKey;
          const dir = tableState.direction;

          const ariaValue = isActive ? (dir === 'desc' ? 'descending' : 'ascending') : 'none';
          btn.setAttribute('aria-sort', ariaValue);
          if (th) th.setAttribute('aria-sort', ariaValue);
          if (indicator) indicator.textContent = isActive ? (dir === 'desc' ? '↓' : '↑') : '⇅';
        });
      }

      function enforceVisibleRows(){
        const scroller = document.querySelector('.table-scroller');
        const tbody = document.querySelector('#rents-table tbody');
        const thead = document.querySelector('#rents-table thead');
        if (!scroller || !tbody) return;
        const firstRow = tbody.querySelector('tr');
        const rowH = firstRow ? firstRow.getBoundingClientRect().height : 0;
        const headH = thead ? thead.getBoundingClientRect().height : 0;
        if (rowH) {
          scroller.style.maxHeight = `${headH + rowH * 8}px`;
        }
      }

      function renderTable(){
        const tbody = document.querySelector('#rents-table tbody');
        if (!tbody) return;
        const frag = document.createDocumentFragment();
        const rows = applySort(getTableRows());

        rows.forEach(row => {
          const tr = document.createElement('tr');

          const tdLabel = document.createElement('td');
          if (row.url){
            const a = document.createElement('a');
            a.href = row.url;
            a.target = '_blank';
            a.rel = 'noopener';
            a.textContent = row.submarket;
            a.title = `Open ${row.submarket} dashboard`;
            tdLabel.appendChild(a);
          } else {
            const span = document.createElement('span');
            span.textContent = row.submarket;
            span.className = 'no-link';
            tdLabel.appendChild(span);
          }

          const tdA = document.createElement('td');
          tdA.textContent = row.priceAText;

          const tdB = document.createElement('td');
          tdB.textContent = row.priceBText;

          tr.appendChild(tdLabel);
          tr.appendChild(tdA);
          tr.appendChild(tdB);
          frag.appendChild(tr);
        });
        tbody.innerHTML = '';
        tbody.appendChild(frag);
        requestAnimationFrame(enforceVisibleRows);
      }

      function setupSorting(){
        document.querySelectorAll('.sort-button').forEach(btn => {
          btn.addEventListener('click', () => {
            const key = btn.getAttribute('data-sort');
            if (!key) return;
            if (tableState.sortKey === key) {
              tableState.direction = tableState.direction === 'desc' ? 'asc' : 'desc';
            } else {
              tableState.sortKey = key;
              tableState.direction = key === 'submarket' ? 'asc' : 'desc';
            }
            updateSortIndicators();
            renderTable();
          });
        });
        updateSortIndicators();
      }

      function buildRentsTable(){
        renderTable();
        setupSorting();
        window.addEventListener('resize', enforceVisibleRows);
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(enforceVisibleRows).catch(() => {});
        }
      }

      function setupPanel(){
        const toggleBtn = document.querySelector('.table-toggle');
        const panel = document.getElementById('rents-panel');
        const closeBtn = document.querySelector('.panel-close');
        const compactMedia = window.matchMedia('(max-width: 960px)');
        const toggleLabel = toggleBtn?.querySelector('.toggle-label');
        const toggleIcon = toggleBtn?.querySelector('.toggle-icon');

        if (!toggleBtn || !panel || !closeBtn) return;

        function syncMapLayout(){
          map.resize();
          debouncedRefit();
        }

        function openPanel(){
          panelUserCollapsed = false;
          panelCollapsedByMedia = false;
          document.body.classList.add('table-open');
          document.body.classList.remove('table-collapsed');
          panel.setAttribute('aria-hidden', 'false');
          toggleBtn.setAttribute('aria-expanded', 'true');
          if (toggleLabel) toggleLabel.textContent = 'Collapse Rents Table'; else toggleBtn.textContent = 'Collapse Rents Table';
          if (toggleIcon) toggleIcon.textContent = '▾';
          toggleBtn.title = 'Collapse rents table';
          syncMapLayout();
        }
        function closePanel(opts = {}){
          panelCollapsedByMedia = opts.reason === 'media';
          if (!panelCollapsedByMedia) panelUserCollapsed = true;
          document.body.classList.remove('table-open');
          document.body.classList.add('table-collapsed');
          panel.setAttribute('aria-hidden', 'true');
          toggleBtn.setAttribute('aria-expanded', 'false');
          if (toggleLabel) toggleLabel.textContent = 'Show Rents Table'; else toggleBtn.textContent = 'Show Rents Table';
          if (toggleIcon) toggleIcon.textContent = '▸';
          toggleBtn.title = 'Show rents table';
          syncMapLayout();
        }
        function togglePanel(){
          const isHidden = panel.getAttribute('aria-hidden') === 'true';
          if (isHidden) openPanel(); else closePanel();
        }

        function applyMediaState(e){
          const matches = e ? e.matches : compactMedia.matches;
          if (matches){
            closePanel({ reason: 'media' });
          } else if (panelCollapsedByMedia && !panelUserCollapsed){
            openPanel();
          } else if (panelUserCollapsed){
            closePanel({ reason: 'user' });
          }
        }

        closePanelForDesktop = closePanel;
        openPanelForDesktop = () => {
          if (!panelUserCollapsed) openPanel();
        };

        toggleBtn.addEventListener('click', togglePanel);
        closeBtn.addEventListener('click', closePanel);

        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closePanel();
        });

        // Open by default on load
        openPanel();
        applyMediaState();
        if (compactMedia.addEventListener) {
          compactMedia.addEventListener('change', applyMediaState);
        } else if (compactMedia.addListener) {
          compactMedia.addListener(applyMediaState);
        }
      }

      /* === Client logos marquee ===
         Loads PNGs from "Client logos" via GitHub Contents API (alphabetical), duplicates strip for seamless LTR scroll.
      */
      const LOGO_DIR = "Client logos";
      const BRANCHES = ["main","master"];
      const REPO_HINT = "CharlieCoughlin1/Central_London_Submarkets";

      function deriveAltFromPath(path){
        try {
          const name = path.split('/').pop().split('.').slice(0,-1).join('.');
          return name.replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim() || 'Client logo';
        } catch(e){ return 'Client logo'; }
      }
      function makeStrip(nodes){
        const ul = document.createElement('ul');
        ul.className = 'logo-strip';
        nodes.forEach(n => ul.appendChild(n));
        return ul;
      }
      function buildNodesFromList(list){
        const nodes = [];
        for (const obj of list){
          const li = document.createElement('li');
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.decoding = 'async';
          img.alt = obj.alt || deriveAltFromPath(obj.src);
          img.src = obj.src;
          img.addEventListener('load', () => debouncedRefit()); // refit map when banner height settles
          img.onerror = () => { li.remove(); debouncedRefit(); };
          li.appendChild(img);
          nodes.push(li);
        }
        return nodes;
      }
      function renderLogoMarqueeFromSrcs(srcs){
        const track = document.getElementById('logo-track');
        if (!track) return;

        const list = srcs
          .filter(src => /\.png$/i.test(src))
          .sort((a,b) => a.toLowerCase().localeCompare(b.toLowerCase()))
          .map(src => ({ src, alt: deriveAltFromPath(src) }));

        const nodes = buildNodesFromList(list);
        track.innerHTML = '';

        if (!nodes.length){
          track.appendChild(makeStrip([]));
          track.appendChild(makeStrip([]));
          track.style.animationPlayState = 'paused';
          debouncedRefit();
          return;
        }

        track.appendChild(makeStrip(nodes));
        track.appendChild(makeStrip(nodes.map(n => n.cloneNode(true))));
        track.style.animationPlayState = 'running';

        setTimeout(() => debouncedRefit(), 250);
      }
      function encodePathSegments(path){
        return path.split('/').map(encodeURIComponent).join('/');
      }
      function guessRepoFromPage(){
        const { hostname, pathname } = window.location;
        if (hostname.endsWith('github.io')){
          const owner = hostname.split('.')[0];
          const seg = pathname.split('/').filter(Boolean);
          const repo = seg.length ? seg[0] : '';
          if (owner && repo) return `${owner}/${repo}`;
        }
        return null;
      }
      async function fetchGithubDirPngs(ownerRepo, branch){
        const [owner, repo] = ownerRepo.split('/');
        const encodedDir = encodePathSegments(LOGO_DIR);
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/${encodedDir}?ref=${encodeURIComponent(branch)}`;
        const r = await fetch(url, { cache: 'no-store' });
        if (!r.ok) throw new Error('No listing');
        const json = await r.json();
        if (!Array.isArray(json)) throw new Error('Unexpected');
        const pngs = json
          .filter(item => item && item.type === 'file' && /\.png$/i.test(item.name))
          .sort((a,b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
        return pngs.map(item => item.download_url || `https://raw.githubusercontent.com/${owner}/${repo}/${encodeURIComponent(branch)}/${encodedDir}/${encodeURIComponent(item.name)}`);
      }
      async function discoverLogoPngs(){
        const candidates = new Set();
        const fromHint = REPO_HINT && REPO_HINT.includes('/') ? REPO_HINT : null;
        const fromPage = guessRepoFromPage();
        if (fromHint) candidates.add(fromHint);
        if (fromPage) candidates.add(fromPage);

        for (const repo of candidates){
          for (const ref of BRANCHES){
            try {
              const urls = await fetchGithubDirPngs(repo, ref);
              if (urls && urls.length) return urls;
            } catch(e){ /* try next */ }
          }
        }
        // Fallback: gh-pages branch for site repos
        if (fromPage){
          try {
            const urls = await fetchGithubDirPngs(fromPage, 'gh-pages');
            if (urls && urls.length) return urls;
          } catch(e){ /* ignore */ }
        }
        return [];
      }
      async function initLogos(){
        // Try manifest first (optional)
        try{
          const r = await fetch(`${encodePathSegments(LOGO_DIR)}/manifest.json`, { cache: 'no-store' });
          if (r.ok){
            const json = await r.json();
            if (Array.isArray(json) && json.length){
              const srcs = json
                .map(x => (typeof x === 'string' ? `${LOGO_DIR}/${x}` : x.src))
                .filter(Boolean)
                .filter(src => /\.png$/i.test(src))
                .map(src => src.replace(/\\/g,'/'));
              srcs.sort((a,b)=> a.toLowerCase().localeCompare(b.toLowerCase()));
              renderLogoMarqueeFromSrcs(srcs);
              return;
            }
          }
        } catch(e){ /* continue to GitHub API path */ }
        const pngSrcs = await discoverLogoPngs();
        renderLogoMarqueeFromSrcs(pngSrcs);
      }

      /* Utilities */
      function debounce(fn, ms){
        let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn.apply(null,args), ms); };
      }

      // DOM init
      if (document.readyState !== 'loading') {
        buildRentsTable();
        setupPanel();
        syncDesktopMode();
        initLogos();
      } else {
        document.addEventListener('DOMContentLoaded', () => {
          buildRentsTable();
          setupPanel();
          syncDesktopMode();
          initLogos();
        });
      }
    </script>
  </body>
</html>
