<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Central London Offices Guide</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/din-pro" />
    <style>
      :root{
        --brand:#CC2030;
        --ink:#0F172A;
        --muted-ink:#475569;
        --surface:#FFFFFF;
        --ui:#F5F6F8;
        --stroke:#E5E7EB;
        --water:#8EC5E8;
        --water-stroke:#6CAED6;
        --radius-1:6px;
        --radius-2:8px;
        --shadow-1:0 4px 12px rgba(0,0,0,.12);
        --popup-accent: var(--brand);
        --header-h: 0px;
      }

      html, body {
        height:100%;
        overflow:hidden; /* Keep original full-screen map layout */
      }
      body {
        margin:0;
        display:block;
        background:var(--surface);
        color:var(--ink);
        font-family:"DIN Pro","DINPro",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      }
      .site-header{
        position:fixed;
        top:0; left:0; right:0;
        z-index:10;
        background:var(--surface);
        border-bottom:1px solid var(--stroke);
        box-shadow:0 1px 2px rgba(0,0,0,.04);
        padding:12px 16px 8px;
        margin:0;
        text-align:center;
      }
      h1{
        margin:0;
        letter-spacing:1px;
        font-weight:700;
        text-transform:uppercase;
        color:var(--brand);
      }
      .subtitle{
        margin:4px 0 0;
        color:var(--muted-ink);
      }
      #map{
        position:fixed;
        top:var(--header-h);
        left:0;
        right:0;
        bottom:0;
        min-height:320px;
        background:var(--ui);
        padding-bottom:env(safe-area-inset-bottom);
        box-sizing:border-box;
      }

      /* Existing small PSF note (unchanged) */
      .psf-control{
        position:absolute;
        bottom:8px;
        right:8px;
        background:rgba(255,255,255,.8);
        border:1px solid var(--stroke);
        border-radius:var(--radius-1);
        padding:4px 8px;
        font-size:.7rem;
        color:var(--muted-ink);
        z-index:3;
      }

      /* Right-side rents table button + panel (unchanged from last version) */
      .panel-controls{
        position:absolute;
        top:12px;
        right:12px;
        display:flex;
        flex-direction:column;
        align-items:flex-end;
        gap:8px;
        z-index:6;
      }
      .table-toggle{
        appearance:none;
        border:1px solid var(--stroke);
        background:rgba(255,255,255,.92);
        border-radius:var(--radius-1);
        box-shadow:var(--shadow-1);
        color:var(--ink);
        font-weight:700;
        letter-spacing:.3px;
        padding:8px 10px;
        font-size:.85rem;
        cursor:pointer;
        transition:background .12s ease, transform .06s ease;
      }
      .table-toggle:hover{ background:#fff; }
      .table-toggle:active{ transform:translateY(1px); }

      .table-panel{
        position:absolute;
        top:calc(100% + 8px);
        right:0;
        width:min(520px, 95vw);
        max-height:min(62vh, 640px);
        background:var(--surface);
        border:1px solid var(--stroke);
        border-radius:10px;
        box-shadow:var(--shadow-1);
        overflow:hidden;
        opacity:0;
        transform:translateY(6px);
        visibility:hidden;
        transition:opacity .18s ease, transform .18s ease, visibility 0s linear .18s;
      }
      .table-panel.open{
        opacity:1;
        transform:translateY(0);
        visibility:visible;
        transition:opacity .18s ease, transform .18s ease;
      }
      .table-panel .panel-accent{
        height:3px;
        background:var(--brand);
      }
      .panel-header{
        display:flex; align-items:center; justify-content:space-between;
        padding:10px 12px 8px;
      }
      .panel-title{
        margin:0;
        font-weight:800;
        letter-spacing:.8px;
        text-transform:uppercase;
        font-size:.95rem;
        color:var(--ink);
      }
      .panel-close{
        appearance:none;
        border:1px solid var(--stroke);
        background:#fff;
        border-radius:8px;
        font-size:1rem;
        line-height:1;
        padding:4px 8px;
        cursor:pointer;
        color:var(--muted-ink);
        transition:background .12s ease;
      }
      .panel-close:hover{ background:#FAFAFB; }

      .table-scroller{
        overflow:auto;
        max-height:calc(62vh - 54px);
        border-top:1px solid var(--stroke);
        background:var(--surface);
      }

      .rent-table{
        width:100%;
        border-collapse:separate;
        border-spacing:0;
        font-variant-numeric:tabular-nums;
      }
      .rent-table caption{
        caption-side:bottom;
        text-align:right;
        padding:10px 12px;
        color:var(--muted-ink);
        font-size:.85rem;
      }
      .rent-table thead th{
        position:sticky;
        top:0;
        z-index:1;
        background:var(--ui);
        color:var(--muted-ink);
        text-align:left;
        font-weight:800;
        padding:12px 14px;
        border-bottom:1px solid var(--stroke);
      }
      .rent-table tbody td{
        padding:12px 14px;
        border-bottom:1px solid #F1F2F4;
      }
      .rent-table tbody tr:nth-child(even){ background:#FAFAFB; }
      .rent-table tbody tr:hover{ background:rgba(204,32,48,0.06); }
      .rent-table a{
        font-weight:700;
        color:var(--ink);
        text-decoration:none;
      }
      .rent-table a:hover{ text-decoration:underline; text-decoration-color:var(--brand); }
      .rent-table .no-link{
        color:var(--muted-ink);
        font-weight:700;
        cursor:default;
      }

      /* --- NEW: Client logo banner at the bottom of the map --- */
      .logo-marquee{
        position:absolute;
        left:12px;
        right:12px;
        bottom:12px;
        z-index:2; /* below PSF control and table button */
        background:rgba(255,255,255,0.88);
        border:1px solid var(--stroke);
        border-radius:12px;
        box-shadow:var(--shadow-1);
        pointer-events:none; /* do not block map interaction */
        backdrop-filter:saturate(120%) blur(4px);
      }
      .logo-marquee .logo-accent{
        height:3px;
        background:var(--brand);
        border-top-left-radius:12px;
        border-top-right-radius:12px;
      }
      .logo-banner-inner{
        padding:6px 8px 8px;
      }
      .banner-subtitle{
        margin:0 6px 2px;
        text-align:center;
        color:var(--muted-ink);
        font-weight:800;
        letter-spacing:.6px;
        text-transform:uppercase;
        font-size:.78rem;
      }
      .logo-viewport{
        position:relative;
        overflow:hidden;
        padding:6px 6px 8px;
      }
      .logo-viewport::before,
      .logo-viewport::after{
        content:"";
        position:absolute;
        top:0; bottom:0;
        width:40px;
        pointer-events:none;
        z-index:1;
      }
      .logo-viewport::before{
        left:0;
        background:linear-gradient(to right, rgba(255,255,255,0.92), rgba(255,255,255,0));
      }
      .logo-viewport::after{
        right:0;
        background:linear-gradient(to left, rgba(255,255,255,0.92), rgba(255,255,255,0));
      }
      .logo-track{
        display:flex;
        align-items:center;
        width:max-content; /* allow content to define width */
        animation: marquee-rtl 55s linear infinite reverse; /* left-to-right */
      }
      @keyframes marquee-rtl{
        0%   { transform: translateX(0); }
        100% { transform: translateX(-50%); } /* two strips -> half width loop */
      }
      .logo-strip{
        display:flex;
        align-items:center;
        gap:28px; /* space between logos */
        list-style:none;
        margin:0;
        padding:0 10px 2px;
        flex:0 0 auto;
      }
      .logo-strip li{
        display:flex;
        align-items:center;
        justify-content:center;
        flex:0 0 auto;
      }
      .logo-strip img{
        display:block;
        height:24px;
        max-width:140px;
        object-fit:contain;
        opacity:.95;
        filter:none; /* keep brand colours */
      }

      @media (max-width:480px){
        .site-header{padding:10px 12px 0;}
        h1{font-size:1.6rem;}
        .custom-popup .maplibregl-popup-content{max-width:calc(100vw - 24px); padding:6px 8px 8px;}
        .popup-title{font-size:.92rem;}
        .price-box{min-width:65px; padding:4px 6px;}
        .rent-table thead th, .rent-table tbody td{ padding:10px 12px; }
        .table-panel{ width:calc(100vw - 24px); right:0; }
        .banner-subtitle{ font-size:.72rem; }
        .logo-strip img{ height:20px; max-width:120px; }
      }
      @media (prefers-reduced-motion: reduce){
        *{transition:none!important;}
        .logo-track{ animation:none!important; }
      }

      /* Popup (unchanged) */
      .custom-popup{pointer-events:none; opacity:0; transform:translateY(2px); transition:opacity .16s ease, transform .16s ease;}
      .custom-popup.active{opacity:1; transform:translateY(0);}
      .custom-popup *{pointer-events:none;user-select:none;}
      .custom-popup .maplibregl-popup-content{
        background:rgba(255,255,255,.85);
        border:1px solid var(--stroke);
        border-radius:10px;
        box-shadow:var(--shadow-1);
        padding:8px 10px 10px;
        margin:0;
        text-align:center;
        box-sizing:border-box;
        white-space:normal;
        overflow-wrap:anywhere;
        word-break:break-word;
        max-width:min(90vw, 260px);
        font-family:"DIN Pro","DINPro",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
        font-variant-numeric:tabular-nums;
        position:relative;
      }
      .custom-popup .maplibregl-popup-content::before{
        content:"";
        position:absolute;
        top:0; left:0; right:0;
        height:3px;
        background:var(--popup-accent);
        border-top-left-radius:10px;
        border-top-right-radius:10px;
      }
      .custom-popup .maplibregl-popup-tip{display:none;}
      .pop-inner{opacity:1; transform:translateY(0); transition:opacity .14s ease, transform .14s ease;}
      .pop-inner.is-out{opacity:0; transform:translateY(4px);}
      .pop-inner.is-in{opacity:1; transform:translateY(0);}
      .popup-title-row{
        display:flex; align-items:center; justify-content:center; gap:8px;
        margin:2px 0 4px;
      }
      .popup-title{
        color:var(--ink);
        font-weight:700; font-size:1rem; letter-spacing:.3px;
        line-height:1.2; margin:0; padding:0 2px;
        text-transform:uppercase;
      }
      .popup-prices{
        margin-top:6px;
        display:flex; justify-content:center; gap:8px; flex-wrap:wrap;
      }
      .price-box{
        border:1px solid var(--stroke);
        background:#FAFAFB;
        border-radius:8px;
        padding:4px 6px;
        min-width:72px;
        line-height:1.2;
      }
      .price-box .grade{
        display:block; color:var(--muted-ink); font-size:.85rem; font-weight:700; letter-spacing:.2px;
      }
      .price-box .price{
        display:block; color:var(--ink); font-size:1rem; font-weight:600;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <h1>CENTRAL LONDON OFFICES GUIDE</h1>
      <p class="subtitle">Click a subdistrict to get started</p>
    </header>

    <div id="map">
      <!-- Right-side toggle and drop-down panel for the table (unchanged) -->
      <div class="panel-controls">
        <button class="table-toggle" type="button" aria-expanded="false" aria-controls="rents-panel" title="Open rents table">Rents Table</button>

        <aside id="rents-panel" class="table-panel" role="dialog" aria-labelledby="rents-panel-title" aria-hidden="true">
          <div class="panel-accent" aria-hidden="true"></div>
          <div class="panel-header">
            <h2 id="rents-panel-title" class="panel-title">Central London Office Rents</h2>
            <button class="panel-close" type="button" aria-label="Close rents table">&times;</button>
          </div>
          <div class="table-scroller">
            <table id="rents-table" class="rent-table" aria-describedby="rents-caption">
              <caption id="rents-caption">*All prices are per sq ft</caption>
              <thead>
                <tr>
                  <th scope="col">Submarket</th>
                  <th scope="col">Grade A</th>
                  <th scope="col">Grade B</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </aside>
      </div>

      <!-- NEW: Client logos banner at the bottom of the map -->
      <div class="logo-marquee" id="logo-marquee" role="region" aria-label="Clients we work with">
        <div class="logo-accent" aria-hidden="true"></div>
        <div class="logo-banner-inner">
          <p class="banner-subtitle">Trusted by leading London office occupiers</p>
          <div class="logo-viewport">
            <div class="logo-track" id="logo-track">
              <!-- JS will inject two identical strips for a seamless left-to-right scroll -->
            </div>
          </div>
        </div>
      </div>

      <div class="psf-control">*All prices are per sq ft</div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <script>
      /* === DATA (unchanged) === */
      var priceData = {
        Camden: { A: "£63.00", B: "£42.50" },
        "Euston & Kings Cross": { A: "£89.00", B: "£60.00" },
        "Mayfair & St James's": { A: "£170.00", B: "£87.00" },
        Soho: { A: "£100.00", B: "£69.50" },
        "Covent Garden": { A: "£90.00", B: "£62.00" },
        "Victoria / Westminster": { A: "£95.00", B: "£60.00" },
        "City (EC2, EC3, EC4)": { A: "£85.00", B: "£52.00" },
        "Clerkenwell & Farringdon": { A: "£90.00", B: "£65.00" },
        "Old Street / Shoreditch": { A: "£80.00", B: "£52.00" },
        "Aldgate / Whitechapel": { A: "£60.00", B: "£40.00" },
        "Vauxhall / Nine Elms & Battersea": { A: "£63.00", B: "£40.00" },
        Southbank: { A: "£85.00", B: "£52.00" },
        Midtown: { A: "£85.00", B: "£55.00" },
        "Canary Wharf": { A: "£55.00", B: "£32.00" },
        "Noho / Fitzrovia": { A: "£105.00", B: "£65.00" },
        Marylebone: { A: "£98.00", B: "£62.50" },
        Paddington: { A: "£85.00", B: "£50.00" },
        "Kensington & Chelsea": { A: "£75.00", B: "£42.50" },
        "White City / Shepherd's Bush": { A: "£58.00", B: "£40.00" },
        Hammersmith: { A: "£58.00", B: "£40.00" },
        "Knightsbridge / Belgravia": { A: "£90.00", B: "£60.00" }
      };

      const labelToUrl = {
        "Noho / Fitzrovia": "https://infogram.com/noho-fitzrovia-1hmr6g8ye03yz2n"
      };

      /* === MAP (restored original behavior) === */
      const root = document.documentElement;
      const headerEl = document.querySelector('.site-header');

      const map = new maplibregl.Map({
        container: 'map',
        style: { version: 8, sources: {}, layers: [{ id: 'background', type: 'background', paint: { 'background-color': '#ffffff' } }] },
        center: [-0.1278, 51.5074],
        zoom: 11,
        canvasContextAttributes: { antialias: true },
        antialias: true
      });

      map.dragPan.disable();
      map.scrollZoom.disable();
      map.doubleClickZoom.disable();
      map.boxZoom.disable();
      map.keyboard.disable();
      map.dragRotate.disable();
      map.touchZoomRotate.disable();
      map.getCanvas().style.cursor = 'default';

      const mapContainer = document.getElementById('map');
      new ResizeObserver(() => map.resize()).observe(mapContainer);
      window.addEventListener('resize', () => map.resize());
      window.addEventListener('orientationchange', () => map.resize());

      async function updateHeaderHeight(){
        if (document.fonts && document.fonts.ready) {
          try { await document.fonts.ready; } catch(e){}
        }
        const h = Math.ceil(headerEl.getBoundingClientRect().height);
        root.style.setProperty('--header-h', h + 'px');
        map.resize();
      }
      updateHeaderHeight();
      const headerRO = new ResizeObserver(() => updateHeaderHeight());
      headerRO.observe(headerEl);
      map.once('load', () => map.resize());

      let hoveredId = null;
      const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, className: 'custom-popup', maxWidth: '260px' });
      popup.on('open', () => popup.getElement().style.pointerEvents = 'none');
      let popupTimer = null;
      let hoverLeaveTimer = null;
      let popupFadeTimer = null;

      const brand = getComputedStyle(document.documentElement).getPropertyValue('--brand').trim();
      const water = getComputedStyle(document.documentElement).getPropertyValue('--water').trim();
      const waterStroke = getComputedStyle(document.documentElement).getPropertyValue('--water-stroke').trim();

      function setHover(id, isHovering) {
        map.setFeatureState({ source: 'subdistricts', id }, { hover: isHovering });
      }

      function getFeatureBoundsCenter(coords) {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        const flat = coords.flat(Infinity);
        for (let i = 0; i < flat.length; i += 2) {
          const x = flat[i], y = flat[i + 1];
          if (x < minX) minX = x;
          if (y < minY) minY = y;
          if (x > maxX) maxX = x;
          if (y > maxY) maxY = y;
        }
        return [(minX + maxX) / 2, (minY + maxY) / 2];
      }

      function renderPopup(label, dataInfo){
        const title = (label || '').toUpperCase();
        const prices = dataInfo ? `
    <div class="popup-prices">
      <div class="price-box"><span class="grade">Grade A</span><span class="price">${dataInfo.A}</span></div>
      <div class="price-box"><span class="grade">Grade B</span><span class="price">${dataInfo.B}</span></div>
    </div>` : '';
        return `
    <div class="pop-inner" data-label="${title}" role="status" aria-live="polite">
      <div class="popup-title-row">
        <h3 class="popup-title">${title}</h3>
      </div>
      ${prices}
    </div>`;
      }

      function removeHover() {
        if (hoveredId) {
          setHover(hoveredId, false);
          hoveredId = null;
          hidePopup();
          map.getCanvas().style.cursor = 'default';
        }
        clearTimeout(popupTimer);
      }

      function showPopup(center, label) {
        const nextHtml = renderPopup(label, priceData[label]);
        const isOpen = popup.isOpen();
        clearTimeout(popupFadeTimer);

        if (!isOpen) {
          popup.setLngLat(center).setHTML(nextHtml).addTo(map);
          requestAnimationFrame(() => popup.getElement().classList.add('active'));
          return;
        }

        const el = popup.getElement();
        if (el) el.classList.add('active');

        const current = popup.getElement().querySelector('.pop-inner');
        const currentLabel = current ? current.getAttribute('data-label') : '';
        const nextLabel = (label || '').toUpperCase();

        if (currentLabel === nextLabel) {
          popup.setLngLat(center);
          return;
        }

        if (current) current.classList.add('is-out');
        setTimeout(() => {
          popup.setLngLat(center).setHTML(nextHtml);
          const fresh = popup.getElement().querySelector('.pop-inner');
          fresh.classList.add('is-out');
          requestAnimationFrame(() => {
            fresh.classList.remove('is-out');
            fresh.classList.add('is-in');
          });
        }, 130);
      }

      function hidePopup(){
        if (!popup.isOpen()) return;
        const el = popup.getElement();
        el.classList.remove('active');
        clearTimeout(popupFadeTimer);
        popupFadeTimer = setTimeout(() => popup.remove(), 180);
      }

      function scheduleClearHover() {
        clearTimeout(hoverLeaveTimer);
        hoverLeaveTimer = setTimeout(removeHover, 100);
      }

      map.on('load', function () {
        var cacheBuster = '?v=' + Date.now();
        var localUrl = 'final_poly.geojson' + cacheBuster;
        var remoteUrl = 'https://raw.githubusercontent.com/CharlieCoughlin1/Central_London_Submarkets/main/final_poly.geojson' + cacheBuster;

        fetch(localUrl)
          .then(function (response) {
            if (!response.ok) { throw new Error('Network response was not ok'); }
            return response.json();
          })
          .catch(function () {
            return fetch(remoteUrl).then(function (response) {
              if (!response.ok) { throw new Error('Network response was not ok'); }
              return response.json();
            });
          })
          .then(function (data) {
            map.addSource('subdistricts', {
              type: 'geojson',
              data: data,
              maxzoom: 22,
              promoteId: 'label'
            });

            map.addLayer({
              id: 'thames-fill',
              type: 'fill',
              source: 'subdistricts',
              filter: ['==', ['get', 'label'], 'River Thames'],
              paint: {
                'fill-color': water,
                'fill-outline-color': 'rgba(0,0,0,0)',
                'fill-opacity': 1
              }
            });

            map.addLayer({
              id: 'thames-outline',
              type: 'line',
              source: 'subdistricts',
              filter: ['==', ['get', 'label'], 'River Thames'],
              paint: {
                'line-color': waterStroke,
                'line-width': 1.2,
                'line-join': 'round',
                'line-cap': 'round',
                'line-smooth': 0.6
              }
            });

            map.addLayer({
              id: 'subdistrict-fills',
              type: 'fill',
              source: 'subdistricts',
              filter: ['!=', ['get', 'label'], 'River Thames'],
              paint: {
                'fill-color': [
                  'case',
                  ['boolean', ['feature-state', 'hover'], false], 'rgba(204,32,48,0.10)',
                  '#EDEFF2'
                ],
                'fill-outline-color': '#B6BCC6',
                'fill-opacity': 1
              }
            });

            map.addLayer({
              id: 'subdistrict-hover-halo',
              type: 'line',
              source: 'subdistricts',
              filter: ['!=', ['get', 'label'], 'River Thames'],
              paint: {
                'line-color': '#000',
                'line-opacity': ['case', ['boolean', ['feature-state', 'hover'], false], 0.06, 0],
                'line-width': ['case', ['boolean', ['feature-state', 'hover'], false], 4, 0],
                'line-blur': 0.8
              },
              layout: { 'line-join': 'round', 'line-cap': 'round' }
            });

            map.addLayer({
              id: 'subdistrict-hover-outline',
              type: 'line',
              source: 'subdistricts',
              filter: ['!=', ['get', 'label'], 'River Thames'],
              paint: {
                'line-color': brand,
                'line-width': ['case', ['boolean', ['feature-state', 'hover'], false], 2, 0],
                'line-opacity': 1,
                'line-blur': 0
              },
              layout: { 'line-join': 'round', 'line-cap': 'round' }
            });

            var bounds = new maplibregl.LngLatBounds();
            data.features.forEach(function (feature) {
              if (feature.properties.label === 'River Thames') return;
              var coords = feature.geometry.coordinates.flat(Infinity);
              for (var i = 0; i < coords.length; i += 2) {
                bounds.extend([coords[i], coords[i + 1]]);
              }
            });
            map.fitBounds(bounds, { padding: { top: 10, right: 20, bottom: 20, left: 20 } });

            function handleMove(e) {
              const features = map.queryRenderedFeatures(e.point, { layers: ['subdistrict-fills'] });
              const feature = features[0];
              if (!feature) {
                map.getCanvas().style.cursor = 'default';
                scheduleClearHover();
                return;
              }

              clearTimeout(hoverLeaveTimer);
              map.getCanvas().style.cursor = 'pointer';
              const id = feature.id || feature.properties.label;
              if (hoveredId !== id) {
                if (hoveredId) setHover(hoveredId, false);
                hoveredId = id;
                setHover(hoveredId, true);
              }

              const center = getFeatureBoundsCenter(feature.geometry.coordinates);
              const label = feature.properties.label;
              showPopup(center, label);
            }

            let pendingMove = false;
            let lastMoveEvent = null;
            map.on('mousemove', function (e) {
              lastMoveEvent = e;
              if (!pendingMove) {
                pendingMove = true;
                requestAnimationFrame(function () {
                  pendingMove = false;
                  handleMove(lastMoveEvent);
                });
              }
            });

            map.on('click', function (e) {
              const features = map.queryRenderedFeatures(e.point, { layers: ['subdistrict-fills'] });
              const feature = features[0];
              if (!feature) return;

              const label = feature.properties.label;
              if (labelToUrl[label]) {
                window.open(labelToUrl[label], '_blank');
                return;
              }
              const id = feature.id || label;
              if (hoveredId !== id) {
                if (hoveredId) setHover(hoveredId, false);
                hoveredId = id;
                setHover(hoveredId, true);
              }

              const center = getFeatureBoundsCenter(feature.geometry.coordinates);
              clearTimeout(hoverLeaveTimer);
              showPopup(center, label);
              clearTimeout(popupTimer);
              popupTimer = setTimeout(removeHover, 2500);
            });
          })
          .catch(function (error) {
            console.error('Error loading GeoJSON:', error);
          });
      });

      /* === Rents Table: populate + panel behavior (unchanged) === */
      function buildRentsTable(){
        const tbody = document.querySelector('#rents-table tbody');
        if (!tbody) return;
        const labels = Object.keys(priceData)
          .filter(l => l !== 'River Thames')
          .sort((a,b)=> a.localeCompare(b));

        const frag = document.createDocumentFragment();
        for (const label of labels){
          const tr = document.createElement('tr');

          const tdLabel = document.createElement('td');
          const url = labelToUrl[label];
          if (url){
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener';
            a.textContent = label;
            a.title = `Open ${label} dashboard`;
            tdLabel.appendChild(a);
          } else {
            const span = document.createElement('span');
            span.textContent = label;
            span.className = 'no-link';
            tdLabel.appendChild(span);
          }

          const tdA = document.createElement('td');
          tdA.textContent = priceData[label]?.A || '—';

          const tdB = document.createElement('td');
          tdB.textContent = priceData[label]?.B || '—';

          tr.appendChild(tdLabel);
          tr.appendChild(tdA);
          tr.appendChild(tdB);
          frag.appendChild(tr);
        }
        tbody.innerHTML = '';
        tbody.appendChild(frag);
      }

      function setupPanel(){
        const toggleBtn = document.querySelector('.table-toggle');
        const panel = document.getElementById('rents-panel');
        const closeBtn = document.querySelector('.panel-close');

        if (!toggleBtn || !panel || !closeBtn) return;

        function openPanel(){
          panel.classList.add('open');
          toggleBtn.setAttribute('aria-expanded', 'true');
          panel.setAttribute('aria-hidden', 'false');
        }
        function closePanel(){
          panel.classList.remove('open');
          toggleBtn.setAttribute('aria-expanded', 'false');
          panel.setAttribute('aria-hidden', 'true');
        }
        function togglePanel(){
          if (panel.classList.contains('open')) closePanel(); else openPanel();
        }

        toggleBtn.addEventListener('click', togglePanel);
        closeBtn.addEventListener('click', closePanel);

        // Close on Escape
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closePanel();
        });

        // Close when clicking outside
        document.addEventListener('click', (e) => {
          if (!panel.contains(e.target) && !toggleBtn.contains(e.target)) {
            closePanel();
          }
        });
      }

      /* === NEW: Client logos marquee builder ===
         Place your logo files in the "Client logos" folder.
         Option A (recommended): create "Client logos/manifest.json" with an array of filenames or {src, alt} objects.
           Example manifest.json:
             ["client1.svg","client2.png", {"src":"client3.svg","alt":"Client 3"}]
         Option B: edit the clientLogos array below.
         Any image that fails to load will be removed gracefully.
      */
      const clientLogos = [
        // Example placeholders — replace with your actual filenames or use manifest.json
        // { src: "Client logos/Client1.svg", alt: "Client 1" },
        // { src: "Client logos/Client2.png", alt: "Client 2" },
        // { src: "Client logos/Client3.svg", alt: "Client 3" }
      ];

      function deriveAltFromPath(path){
        try {
          const name = path.split('/').pop().split('.').slice(0,-1).join('.');
          return name.replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim();
        } catch(e){ return 'Client logo'; }
      }

      function buildLogoMarquee(list){
        const track = document.getElementById('logo-track');
        const banner = document.getElementById('logo-marquee');
        if (!track || !banner) return;

        const items = Array.isArray(list) ? list.slice() : [];
        if (!items.length){
          // If still empty, hide the banner shell
          banner.style.display = 'none';
          return;
        }

        const makeStrip = () => {
          const ul = document.createElement('ul');
          ul.className = 'logo-strip';
          for (const item of items){
            const obj = (typeof item === 'string') ? { src: 'Client logos/' + item, alt: deriveAltFromPath(item) } : item;
            const li = document.createElement('li');
            const img = document.createElement('img');
            img.loading = 'lazy';
            img.decoding = 'async';
            img.alt = obj.alt || deriveAltFromPath(obj.src || '');
            img.src = obj.src || '';
            img.onerror = () => { li.remove(); };
            li.appendChild(img);
            ul.appendChild(li);
          }
          return ul;
        };

        track.innerHTML = '';
        track.appendChild(makeStrip());
        track.appendChild(makeStrip()); // duplicate for seamless loop
      }

      function initLogos(){
        // Try to fetch a manifest first
        fetch('Client logos/manifest.json', { cache: 'no-store' })
          .then(r => r.ok ? r.json() : Promise.reject())
          .then(json => buildLogoMarquee(json))
          .catch(() => buildLogoMarquee(clientLogos));
      }

      // DOM init
      if (document.readyState !== 'loading') {
        buildRentsTable();
        setupPanel();
        initLogos();
      } else {
        document.addEventListener('DOMContentLoaded', () => {
          buildRentsTable();
          setupPanel();
          initLogos();
        });
      }
    </script>
  </body>
</html>
